<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>token Tool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .section { margin-bottom: 20px; border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9em; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: center; margin-top: 10px; }
        .checkbox-group input { width: auto; margin-right: 10px; }
        button { margin-top: 15px; padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #2980b9; }
        #logArea { background: #222; color: #0f0; padding: 10px; height: 150px; overflow-y: scroll; font-family: monospace; border-radius: 4px; margin-top: 20px; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
    </style>
</head>
<body>
<div class="container">
    <h1>token Tool</h1>
    <div class="section">
        <label>Cloudflare Worker URL:</label>
        <input type="text" id="workerUrl" placeholder="https://your-worker.workers.dev" required>
        <label>T (Token):</label>
        <textarea id="tokens" rows="3" placeholder="トークンを入力 (複数可、改行区切り)"></textarea>
    </div>

    <div class="section" id="idSettings">
        <h2>ID設定</h2>
        <div class="flex-row">
            <div><label>サーバーID:</label><input type="text" id="guildId"></div>
            <div><label>チャンネルID:</label><input type="text" id="channelId"></div>
        </div>
        <div class="flex-row">
            <div><label>ユーザーID (カンマ区切り):</label><input type="text" id="userIds"></div>
            <div><label>非メンションブラックリスト:</label><input type="text" id="blacklistIds"></div>
        </div>
    </div>

    <div class="section" id="msgSettings">
        <h2>メッセージ設定</h2>
        <label>発言内容:</label>
        <textarea id="messageContent" rows="3"></textarea>
        
        <div class="flex-row">
            <div><label>発言回数:</label><input type="number" id="msgCount" value="1"></div>
            <div><label>遅延(ミリ秒):</label><input type="number" id="msgDelay" value="1000"></div>
            <div><label>ランダムメンション数:</label><input type="number" id="randMentionCount" value="0"></div>
            <div><label>ランダム文字数:</label><input type="number" id="randCharCount" value="0"></div>
        </div>

        <div class="checkbox-group"><input type="checkbox" id="includePoll"><label>投票を含める</label></div>
        <div id="pollSettings" style="display:none; margin-left:20px; border-left:2px solid #3498db; padding-left:10px;">
            <label>投票タイトル:</label><input type="text" id="pollTitle">
            <label>投票の回答 (カンマ区切り):</label><input type="text" id="pollAnswers">
            <label>開催期間 (時間):</label>
            <select id="pollDuration">
                <option value="1">1</option><option value="4">4</option><option value="8">8</option>
                <option value="24" selected>24</option><option value="72">72</option><option value="168">168</option><option value="336">336</option>
            </select>
        </div>

        <h3>対策オプション</h3>
        <div class="checkbox-group"><input type="checkbox" id="optRandStr"><label>ランダム文字追加 対BOT用</label></div>
        <div class="checkbox-group"><input type="checkbox" id="optZeroWidth"><label>ゼロ幅スペース追加 対BOT用</label></div>
        <div class="checkbox-group"><input type="checkbox" id="optSpecialChar"><label>特殊記号追加 対AUTOMOD用</label></div>

        <button onclick="startAction('message')">送信開始</button>
    </div>

    <div class="section">
        <h2>その他の機能</h2>
        <label>対象のメッセージID (リアクション/転送用):</label>
        <input type="text" id="targetMessageId">
        <label>絵文字 (標準 または カスタム emoji_name:emoji_id):</label>
        <input type="text" id="emojiList" value="😀,😃,😄,😁,😆">
        <button onclick="startAction('reaction')" style="background:#e67e22;">リアクション送信開始</button>

        <hr>
        <label>スレッドタイトル:</label><input type="text" id="threadTitle">
        <button onclick="startAction('thread')" style="background:#8e44ad;">スレッド送信開始</button>

        <hr>
        <label>新しいニックネーム:</label><input type="text" id="newNickname">
        <button onclick="startAction('nickname')" style="background:#16a085;">ニックネーム変更</button>
    </div>

    <div class="section">
        <h2>ログ</h2>
        <div id="logArea"></div>
    </div>
</div>
    
<script>
// util.js
function log(msg) {
    const logArea = document.getElementById('logArea');
    const time = new Date().toLocaleTimeString();
    logArea.innerHTML += `[${time}] ${msg}<br>`;
    logArea.scrollTop = logArea.scrollHeight;
}

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));


function getTokens() {
    return document.getElementById('tokens').value.split('\n').map(t => t.trim()).filter(t => t.length > 0);
}




const zeroWidthChars = ['\u200B', '\u200C', '\u200D', '\uFEFF'];
function addZeroWidthSpaces(text) {
    if(!document.getElementById('optZeroWidth').checked) return text;
    return text.split('').map(char => {

        const zw = zeroWidthChars[Math.floor(Math.random() * zeroWidthChars.length)];
        return char + zw;
    }).join('');
}


const specialChars = ['!', '"', '#', '$', '%', '&', "'", '(', ')', '*', '+', ',', '-', '.', '/', ':', ';', '<', '=', '>', '?', '@', '[', '\\', ']', '^', '_', '`', '{', '|', '}', '~', '§', '¨', '©', 'ª', '«', '¬', '®', '¯', '°', '±', '²', '³', '´', 'µ', '¶', '·', '¸', '¹', 'º', '»', '¼', '½', '¾', '¿', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅', '✦', '✧'];
function addSpecialChars(text) {
    if(!document.getElementById('optSpecialChar').checked) return text;
    let result = '';
    for(let i = 0; i < text.length; i++) {
        result += text[i];
        if(Math.random() > 0.6) {
            result += specialChars[Math.floor(Math.random() * specialChars.length)];
        }
    }
    return result;
}


function generateRandomString(length) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let result = '';
    for(let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}


function generateRandomMentions(count, userIdsStr, blacklistStr) {
    if (count <= 0 || !userIdsStr) return '';
    let users = userIdsStr.split(',').map(id => id.trim()).filter(id => id);
    let blacklist = blacklistStr.split(',').map(id => id.trim());
    users = users.filter(id => !blacklist.includes(id));
    if (users.length === 0) return '';
    
    let mentions = '';
    for(let i = 0; i < count; i++) {
        const randUser = users[Math.floor(Math.random() * users.length)];
        mentions += `<@${randUser}> `;
    }
    return mentions;
}


function buildMessage(baseText) {
    let text = baseText;
    text = addSpecialChars(text);
    text = addZeroWidthSpaces(text);
    
    const randCount = parseInt(document.getElementById('randCharCount').value) || 0;
    if (document.getElementById('optRandStr').checked || randCount > 0) {
        const len = randCount > 0 ? randCount : 10; // デフォルト10文字
        text += '\n' + generateRandomString(len);
    }
    
    const mentionCount = parseInt(document.getElementById('randMentionCount').value) || 0;
    if (mentionCount > 0) {
        text += '\n' + generateRandomMentions(mentionCount, document.getElementById('userIds').value, document.getElementById('blacklistIds').value);
    }
    return text;
}


document.getElementById('includePoll').addEventListener('change', (e) => {
    document.getElementById('pollSettings').style.display = e.target.checked ? 'block' : 'none';
});
   


async function sendRequest(token, method, endpoint, payload = null) {
    const workerUrl = document.getElementById('workerUrl').value;
    if(!workerUrl) { log("エラー: Worker URLが未設定です"); return null; }

    const url = `https://discord.com/api/v10${endpoint}`;
    const options = {
        method: method,
        headers: {
            "Authorization": token,
            "X-Target-URL": url, 
            "Content-Type": "application/json"
        }
    };
    if (payload && method !== 'GET') {
        options.body = JSON.stringify(payload);
    }

    try {
        const res = await fetch(workerUrl, options);
        if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return await res.json().catch(() => ({}));
    } catch(err) {
        log(`API通信エラー: ${err.message}`);
        return null;
    }
}


async function processMessage() {
    const tokens = getTokens();
    const channelId = document.getElementById('channelId').value;
    const count = parseInt(document.getElementById('msgCount').value) || 1;
    const delay = parseInt(document.getElementById('msgDelay').value) || 1000;
    const baseText = document.getElementById('messageContent').value;
    const includePoll = document.getElementById('includePoll').checked;

    if (!channelId) { log("エラー: チャンネルIDがありません"); return; }

    log(`メッセージ送信開始 (対象: ${tokens.length}アカウント, 回数: ${count})`);

    for(let i = 0; i < count; i++) {
        for(let t = 0; t < tokens.length; t++) {
            let payload = { content: buildMessage(baseText) };

     
            if (includePoll) {
                const answers = document.getElementById('pollAnswers').value.split(',').map(a => ({ poll_media: { text: a.trim() } }));
                payload.poll = {
                    question: { text: document.getElementById('pollTitle').value },
                    answers: answers,
                    duration: parseInt(document.getElementById('pollDuration').value) || 24,
                    allow_multiselect: false
                };
            }

            const res = await sendRequest(tokens[t], 'POST', `/channels/${channelId}/messages`, payload);
            if(res && res.id) log(`[Success] Token ${t+1}: メッセージ送信済 (ID: ${res.id})`);
            await sleep(delay);
        }
    }
    log("メッセージ送信完了");
}


async function processReaction() {
    const tokens = getTokens();
    const channelId = document.getElementById('channelId').value;
    const messageId = document.getElementById('targetMessageId').value;
    const delay = parseInt(document.getElementById('msgDelay').value) || 1000;
    
    if (!channelId || !messageId) { log("エラー: チャンネルIDまたはメッセージIDがありません"); return; }

    const emojis = document.getElementById('emojiList').value.split(',').map(e => e.trim());
    
    log(`リアクション開始 (対象: ${tokens.length}アカウント)`);

    for(let t = 0; t < tokens.length; t++) {
        for(let e of emojis) {
       
            let encodedEmoji = e.includes(':') ? e : encodeURIComponent(e);
            const res = await sendRequest(tokens[t], 'PUT', `/channels/${channelId}/messages/${messageId}/reactions/${encodedEmoji}/@me`);
            log(`[Reaction] Token ${t+1}: ${e} 追加試行`);
            await sleep(delay);
        }
    }
    log("リアクション完了");
}



async function processThread() {
    const tokens = getTokens();
    const channelId = document.getElementById('channelId').value;
    const title = document.getElementById('threadTitle').value || "Thread";
    const baseText = document.getElementById('messageContent').value || "Thread Content";
    const delay = parseInt(document.getElementById('msgDelay').value) || 1000;
    
    if (!channelId) { log("エラー: チャンネルIDがありません"); return; }

    log(`スレッド作成開始`);
    for(let t = 0; t < tokens.length; t++) {
        const payload = {
            name: title,
            type: 11, // Public Thread
            auto_archive_duration: 1440
        };
    
        const res = await sendRequest(tokens[t], 'POST', `/channels/${channelId}/threads`, payload);
        if(res && res.id) {
            log(`[Success] Token ${t+1}: スレッド作成済 (ID: ${res.id})`);
      
            await sendRequest(tokens[t], 'POST', `/channels/${res.id}/messages`, { content: buildMessage(baseText) });
        }
        await sleep(delay);
    }
    log("スレッド作成完了");
}


async function processNickname() {
    const tokens = getTokens();
    const guildId = document.getElementById('guildId').value;
    let newNick = document.getElementById('newNickname').value;
    
    if (!guildId) { log("エラー: サーバー(Guild) IDがありません"); return; }


    newNick = buildMessage(newNick); 

    log(`ニックネーム変更開始`);
    for(let t = 0; t < tokens.length; t++) {
        const payload = { nick: newNick };
        const res = await sendRequest(tokens[t], 'PATCH', `/guilds/${guildId}/members/@me`, payload);
        log(`[Nickname] Token ${t+1}: 変更完了`);
        await sleep(500); 
    }
    log("ニックネーム変更完了");
}


async function startAction(type) {
    if (getTokens().length === 0) {
        log("エラー: トークンが入力されていません");
        return;
    }

    switch(type) {
        case 'message':
            await processMessage();
            break;
        case 'reaction':
            await processReaction();
            break;
        case 'thread':
            await processThread();
            break;
        case 'nickname':
            await processNickname();
            break;
        default:
            log("不明なアクションです");
    }
}
<script>
</body>
</html>
